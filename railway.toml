# Railway detects two services from this repo.
# Each service overrides these defaults in the dashboard.
#
# Backend service settings (set in Railway dashboard):
#   Build:  pip install -r backend/requirements.txt
#   Start:  uvicorn backend.main:app --host 0.0.0.0 --port $PORT
#   Env:    GOOGLE_API_KEY = <your key>
#
# Frontend service settings (set in Railway dashboard):
#   Build:  npm ci && npm run build
#   Start:  npm run preview
#   Env:    VITE_API_URL = https://<backend-service>.up.railway.app

[deploy]
restartPolicyType = "on_failure"
